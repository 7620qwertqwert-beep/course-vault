<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>查看资料 · 信师大南湖课栈</title>
<link rel="icon" href="data:,">
<style>
  :root{--pink:#c2466b;--ink:#222;--muted:#7b7b7b;--line:#e6e6e6;--bg:#fafafa}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:16px/1.7 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
  .bar{position:sticky;top:0;z-index:9;display:flex;align-items:center;gap:10px;
       padding:10px 12px;background:#fff;border-bottom:1px solid var(--line)}
  .bar a{color:var(--pink);text-decoration:none;font-size:15px;flex:0 0 auto}
  .bar .name{flex:1;min-width:0;font-size:13px;color:var(--muted);
       white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .wrap{max-width:820px;margin:0 auto;padding:14px 14px 40px}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px}
  img.pic{display:block;max-width:100%;height:auto;border-radius:10px;margin:0 auto}
  iframe.pdf{width:100%;height:78vh;border:1px solid var(--line);border-radius:10px;background:#fff}
  pre{white-space:pre-wrap;word-break:break-word;background:#f7f7f7;padding:12px;border-radius:10px;
      font-size:14px;line-height:1.65;overflow-x:auto}
  h1,h2,h3,h4{line-height:1.4;margin:18px 0 8px}
  h1{font-size:20px}h2{font-size:18px}h3{font-size:16px}h4{font-size:15px}
  p{margin:8px 0}
  ul{margin:8px 0 8px 22px;padding:0}
  li{margin:4px 0}
  code{background:#f2f2f2;padding:1px 5px;border-radius:4px;font-size:14px}
  table{border-collapse:collapse;width:100%;margin:10px 0;font-size:14px}
  td,th{border:1px solid var(--line);padding:6px 8px;text-align:left}
  .tip{color:var(--muted);font-size:14px;text-align:center;padding:24px 8px}
  .tip a{color:var(--pink)}
</style>
</head>
<body>
<div class="bar">
  <a href="./">‹ 返回</a>
  <span class="name" id="name">加载中…</span>
  <a id="dl" href="#" download>下载原件</a>
</div>
<div class="wrap">
  <div class="card" id="content"><div class="tip">加载中…</div></div>
</div>
<script>
(function () {
  var AMP = String.fromCharCode(38), LT = String.fromCharCode(60),
      GT = String.fromCharCode(62), Q = String.fromCharCode(34), APOS = String.fromCharCode(39);

  function esc(s) {
    return String(s == null ? "" : s)
      .split(AMP).join(AMP + "amp;")
      .split(LT).join(AMP + "lt;")
      .split(GT).join(AMP + "gt;")
      .split(Q).join(AMP + "quot;")
      .split(APOS).join(AMP + "#39;");
  }
  function encPath(p) { return p.split("/").map(encodeURIComponent).join("/"); }
  function inline(s) {
    var t = esc(s);
    t = t.replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
    t = t.replace(/`([^`]+)`/g, "<code>$1</code>");
    return t;
  }
  function tableHtml(rows) {
    var body = "";
    rows.forEach(function (r) {
      if (/^[\s|:\-]+$/.test(r)) return;              // 分隔行
      var cells = r.replace(/^\s*\|/, "").replace(/\|\s*$/, "").split("|");
      body += "<tr>" + cells.map(function (c) { return "<td>" + inline(c.trim()) + "</td>"; }).join("") + "</tr>";
    });
    return "<table>" + body + "</table>";
  }
  function mdToHtml(src) {
    var lines = src.split(/\r?\n/), out = [], list = [], inCode = false;
    function flush() {
      if (list.length) {
        out.push("<ul>" + list.map(function (x) { return "<li>" + x + "</li>"; }).join("") + "</ul>");
        list = [];
      }
    }
    for (var i = 0; i < lines.length; i++) {
      var l = lines[i];
      if (/^\s*```/.test(l)) {
        flush();
        out.push(inCode ? "</pre>" : "<pre>");
        inCode = !inCode;
        continue;
      }
      if (inCode) { out.push(esc(l)); continue; }
      var h = l.match(/^(#{1,6})\s+(.*)$/);
      if (h) {
        flush();
        var n = h[1].length;
        out.push("<h" + n + ">" + inline(h[2]) + "</h" + n + ">");
        continue;
      }
      if (/^\s*\|/.test(l)) {
        flush();
        var rows = [];
        while (i < lines.length && /^\s*\|/.test(lines[i])) { rows.push(lines[i]); i++; }
        i--;
        out.push(tableHtml(rows));
        continue;
      }
      if (/^\s*[-*+]\s+/.test(l)) { list.push(inline(l.replace(/^\s*[-*+]\s+/, ""))); continue; }
      if (/^\s*$/.test(l)) { flush(); continue; }
      flush();
      out.push("<p>" + inline(l) + "</p>");
    }
    flush();
    if (inCode) out.push("</pre>");
    return out.join("\n");
  }

  var p = new URLSearchParams(location.search).get("p") || "";
  var content = document.getElementById("content");
  var dl = document.getElementById("dl");
  if (!p) {
    content.innerHTML = '<div class="tip">没有指定文件。<a href="./">回到首页</a></div>';
    return;
  }
  // 只允许仓库内的 courses/ 路径：拒绝绝对路径、协议相对（//evil.com）、.. 穿越
  if (p.charAt(0) === "/" || p.indexOf("courses/") !== 0 || p.indexOf("..") >= 0) {
    content.innerHTML = '<div class="tip">路径不合法，已拒绝。<a href="./">回到首页</a></div>';
    return;
  }
  var url = "/" + encPath(p);
  var name = p.split("/").pop();
  document.getElementById("name").textContent = name;
  document.title = name + " · 信师大南湖课栈";
  dl.href = url;
  dl.setAttribute("download", name);
  var ext = (name.split(".").pop() || "").toLowerCase();

  if (["jpg", "jpeg", "png", "webp", "gif", "bmp"].indexOf(ext) >= 0) {
    content.innerHTML = '<img class="pic" alt="" src="' + url + '">';
  } else if (ext === "pdf") {
    content.innerHTML = '<iframe class="pdf" src="' + url + '"></iframe>' +
      '<div class="tip">看不到？<a href="' + url + '" download>下载 PDF</a></div>';
  } else if (ext === "md" || ext === "txt") {
    var LIMIT = 5 * 1024 * 1024;
    fetch(url).then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      var len = parseInt(r.headers.get("content-length") || "0", 10);
      if (len > LIMIT) throw new Error("TOO_BIG");
      return r.text();
    }).then(function (t) {
      if (t.length > LIMIT) throw new Error("TOO_BIG");
      content.innerHTML = ext === "md" ? mdToHtml(t) : "<pre>" + esc(t) + "</pre>";
    }).catch(function (err) {
      if (err && err.message === "TOO_BIG") {
        content.innerHTML = '<div class="tip">文件较大（超过 5MB），页面里就不展开了，' +
          '<a href="' + url + '" download>点这里下载</a>后查看；还打不开可 <a href="upload.html#fb">反馈</a>。</div>';
      } else {
        content.innerHTML = '<div class="tip">读取失败（' + esc(err && err.message) + '），请' +
          '<a href="' + url + '" download>下载原件</a>；还不行就 <a href="upload.html#fb">反馈</a></div>';
      }
    });
  } else {
    content.innerHTML = '<div class="tip">这个类型（.' + esc(ext) + '）浏览器里看不了，' +
      '<a href="' + url + '" download>点这里下载</a>后用对应软件打开；文件坏了可 <a href="upload.html#fb">反馈</a>。</div>';
  }
})();
</script>
</body>
</html>
