<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>信师大南湖课栈 · 找资料</title>
<link rel="icon" href="data:,">

<style>
  :root{--pink:#c2466b;--ink:#222;--muted:#7b7b7b;--line:#e6e6e6;--bg:#fafafa}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:16px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
  .wrap{max-width:760px;margin:0 auto;padding:14px 14px 44px}
  header{text-align:center;padding:12px 0 4px}
  h1{font-size:21px;margin:0 0 4px}
  .sub{color:var(--muted);font-size:12.5px}
  .searchbar{display:flex;gap:8px;margin:14px 0 6px}
  .searchbar input{flex:1;min-width:0;padding:13px 14px;font-size:16px;color:var(--ink);
      border:1px solid var(--line);border-radius:12px;background:#fff;-webkit-appearance:none}
  .searchbar input:focus{outline:none;border-color:var(--pink)}
  .searchbar button{flex:0 0 auto;padding:0 18px;font-size:16px;border:none;border-radius:12px;
      background:var(--pink);color:#fff}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:12px 0}
  .row{margin:10px 0}
  .row:first-child{margin-top:0}
  label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:6px}
  select{width:100%;padding:12px;font-size:16px;color:var(--ink);
      border:1px solid var(--line);border-radius:12px;background:#fff;-webkit-appearance:none}
  .grp{font-size:13px;color:var(--muted);margin:18px 2px 6px}
  .item{display:flex;align-items:center;gap:10px;padding:10px 13px;margin:8px 0;border:1px solid var(--line);
      border-radius:12px;background:#fff;text-decoration:none;color:inherit}
  .item:active{background:#fff5f8}
  .item .body{flex:1;min-width:0}
  .item .n{font-weight:600;word-break:break-all}
  .item .m{font-size:12.5px;color:var(--muted);margin-top:3px}
  .item .act{flex:0 0 auto;color:var(--pink);font-size:13px;margin-left:8px}
  .thumb{width:54px;height:54px;flex:0 0 auto;object-fit:cover;border-radius:8px;background:#f4f4f4}
  .empty{color:var(--muted);text-align:center;padding:26px 8px;font-size:14px}
  .empty a{color:var(--pink)}
  .crumb{font-size:12.5px;color:var(--muted);margin:12px 2px 4px}
  .crumb a{color:var(--pink);text-decoration:none}
  .cname{font-size:19px;font-weight:700;margin:2px 0 0;word-break:break-all}
  .tags{margin:8px 0 2px}
  .chips{display:flex;flex-wrap:wrap;align-items:center;gap:0 2px;margin:6px 0 2px}
  .chiplabel{font-size:12px;color:var(--muted);margin-right:6px}
  .chip{display:inline-flex;align-items:center;min-height:44px;padding:0 6px;
      font-size:13.5px;color:var(--muted);cursor:pointer}
  .chip.on{color:var(--pink);font-weight:600}
  .recentempty{font-size:13px;color:var(--muted);text-align:center;padding:14px 8px}
  .recentempty a{color:var(--pink)}
  .srchsum{font-size:13px;color:var(--muted);margin:14px 2px 2px}
  .srchsum b{color:var(--ink);font-weight:600}
  .subfs{margin:2px 0 12px 10px;padding:0 14px 0 10px;border-left:2px solid var(--line)}
  .fitem{display:flex;align-items:center;gap:8px;min-height:44px;padding:0;text-decoration:none;color:inherit;font-size:13.5px}
  .fitem .ft{flex:0 0 auto;font-size:11.5px;color:var(--pink);background:var(--pink-soft);border-radius:4px;padding:1px 5px}
  .fitem .fn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .fitem .fa{flex:0 0 auto;color:var(--muted);font-size:12.5px}
  .fmore{font-size:12.5px;color:var(--muted);padding:6px 2px;text-decoration:none;display:block}
  .entry{background:#fff;border:1px solid var(--line);border-radius:12px;margin:8px 0;padding:0 13px}
  .entry summary{min-height:44px;display:flex;align-items:center;font-size:13.5px;cursor:pointer;list-style:none}
  .entry summary::-webkit-details-marker{display:none}
  .entry summary::after{content:"\25be";margin-left:auto;color:var(--muted);font-size:11px}
  .exact{font-size:11px;color:var(--pink);border:1px solid var(--pink);border-radius:4px;padding:0 4px;font-weight:400;margin-left:4px}
  .gone{color:var(--muted);font-size:12.5px;margin-left:6px}
  .plainlink{font-size:13px;color:var(--ink);text-decoration:none}
  mark{background:#ffe0e8;color:inherit;border-radius:3px}
  footer{margin-top:28px;text-align:center;font-size:13px;color:var(--muted)}
  footer a{color:var(--pink);text-decoration:none;margin:0 6px}
  .note{font-size:12.5px;color:var(--muted);text-align:center;margin-top:10px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>信师大<span>南湖课栈</span></h1>
    <div class="sub" id="stats">加载中…</div>
  </header>

  <!-- 首页 -->
  <div id="home">
    <div class="searchbar">
      <input id="q" type="search" placeholder="搜课程或资料：解剖 / 骨绘画" autocomplete="off" enterkeyhint="search">
      <button id="go">搜索</button>
    </div>
    <div id="recent"></div>
    <div id="results"></div>

    <div id="browse">
      <div class="card">
        <div class="row"><label>学院</label>
          <select id="college"><option value="">请选择学院</option></select></div>
        <div class="row"><label>专业</label>
          <select id="major" disabled><option value="">先选学院</option></select></div>
        <div class="row"><label>课程</label>
          <select id="course" disabled><option value="">先选专业</option></select></div>
      </div>
    </div>
  </div>

  <!-- 课程详情 -->
  <div id="courseview" style="display:none"></div>

  <footer>
    <a href="upload.html">上传资料</a> ·
    <a href="https://gitee.com/youliboshi/course-vault">仓库首页</a> ·
    <a href="https://gitee.com/youliboshi/course-vault/blob/main/INDEX.md">全部课程索引</a>
    <div class="note">只收课程学习资料，别传个人信息。</div>
  </footer>
</div>

<script>
(function () {
  var REPO = "https://gitee.com/youliboshi/course-vault";
  var RAW = REPO + "/raw/main/";
  var TYPES = ["笔记", "课件", "试卷", "作业", "实验报告", "复习资料"];
  var DATA = null;

  function $(id) { return document.getElementById(id); }
  var AMP = String.fromCharCode(38), QUOT = String.fromCharCode(34);
  function esc(s) {
    return String(s == null ? "" : s)
      .split(AMP).join(AMP + "amp;")
      .split("<").join(AMP + "lt;")
      .split(">").join(AMP + "gt;")
      .split(QUOT).join(AMP + "quot;");
  }
  function encPath(p) { return p.split("/").map(encodeURIComponent).join("/"); }
  // 下载走本站静态目录（/courses/...）。Gitee raw 有防盗链：带 Referer 过去会 403。
  function rawUrl(c, f) { return "/" + encPath(c.p + "/" + f.t + "/" + f.n); }
  // 站内查看页：md/pdf/图片都在页面里直接打开，另有「下载原件」
  function viewUrl(c, f) { return "view.html?p=" + encodeURIComponent(c.p + "/" + f.t + "/" + f.n); }
  var IMG_RE = /\.(jpe?g|png|webp)$/i;
  function thumbUrl(c, f) {
    var rel = (c.p + "/" + f.t + "/" + f.n).replace(/\.[^.]+$/, ".jpg");
    return "/_thumb/" + encPath(rel);
  }
  // 统一生成一条资料条目：图片带 54px 缩略图（不占多少版面，也不进仓库）
  function fileItem(c, f, key, prefix) {
    var img = IMG_RE.test(f.n)
      ? '<img class="thumb" loading="lazy" alt="" src="' + thumbUrl(c, f) + '">'
      : "";
    var meta = (prefix ? prefix + " › " : "") + f.t + " · " + sizeText(f.s);
    return '<a class="item" href="' + viewUrl(c, f) + '" target="_blank" rel="noopener">' + img +
      '<div class="body"><div class="n">' + mark(f.n, key) + '</div>' +
      '<div class="m">' + esc(meta) + '</div></div>' +
      '<span class="act">打开</span></a>';
  }
  function courseUrl(c) { return "#/c/" + encodeURIComponent(c.p); }
  function giteeDirUrl(c) { return REPO + "/tree/main/" + encPath(c.p); }
  function sizeText(n) {
    if (!n && n !== 0) return "";
    if (n < 1024) return n + " B";
    if (n < 1024 * 1024) return (n / 1024).toFixed(0) + " KB";
    return (n / 1024 / 1024).toFixed(1) + " MB";
  }
  function pathText(c) {
    return c.m ? (c.c + " › " + c.m) : "公共课";
  }
  function mark(text, key) {
    var safe = esc(text);
    var list = [].concat(key).filter(function (k) { return k; });
    if (!list.length) return safe;
    var low = safe.toLowerCase(), best = -1, bl = 0;
    list.forEach(function (k) {
      var kk = esc(String(k)).toLowerCase();
      var i = low.indexOf(kk);
      if (i >= 0 && (best < 0 || i < best)) { best = i; bl = kk.length; }
    });
    if (best < 0) return safe;
    return safe.slice(0, best) + "<mark>" + safe.slice(best, best + bl) + "</mark>" + safe.slice(best + bl);
  }


  /* ---------- 搜索：归一化 / 分词 / 打分 ---------- */
  // 统一：NFKC（全角转半角）、小写、去装饰标点、把 ／›-_ 当分隔符
  var DECOR = /[《》〈〉「」『』【】（）()\[\]{}"'“”‘’·、,，。！？!?：:；;]/g;
  function norm(s) {
    s = String(s == null ? "" : s);
    if (s.normalize) s = s.normalize("NFKC");
    return s.toLowerCase()
      .replace(DECOR, " ")
      .replace(/[／\\]/g, "/")
      .replace(/›/g, " ")
      .replace(/[_\-]+/g, " ")
      .replace(/\s+/g, " ")
      .replace(/^ | $/g, "");
  }
  function tokens(q) {
    var s = norm(q);
    if (!s) return [];
    return s.split(/[\s\/]+/).filter(function (t) { return t; });
  }
  // 单个 token 对课名的得分：完全相同 > 前缀 > 包含（含覆盖率与位置修正）
  function baseScore(n, tk) {
    var p = n.indexOf(tk);
    if (p < 0) return 0;
    if (n === tk) return 1000;
    if (p === 0) return 760;
    var cov = tk.length / n.length;
    var b = 400 + 200 * cov - Math.min(p, 20);
    if (p > 0 && n.charAt(p - 1) === " ") b += 60;
    return b;
  }
  // 返回 null 表示不匹配；否则给出分数与命中的资料
  function matchCourse(c, tks) {
    var n = norm(c.n), m = norm(c.m || ""), col = norm(c.c);
    var nameHit = false, fileHit = false, typeHit = false, majorHit = false, colHit = false;
    for (var i = 0; i < tks.length; i++) {
      var tk = tks[i], any = false;
      if (n.indexOf(tk) >= 0) { nameHit = true; any = true; }
      if (m.indexOf(tk) >= 0) { majorHit = true; any = true; }
      if (col.indexOf(tk) >= 0) { colHit = true; any = true; }
      for (var j = 0; j < c.f.length; j++) {
        var f = c.f[j];
        if (norm(f.n).indexOf(tk) >= 0) { fileHit = true; any = true; }
        else if (norm(f.t).indexOf(tk) >= 0) { typeHit = true; any = true; }
      }
      if (!any) return null;
    }
    // 只有学院/专业命中、且课名和资料都没中 → 不算课程结果（走专业/学院入口）
    if (!(nameHit || fileHit || typeHit)) return null;
    var score = 0;
    for (var k = 0; k < tks.length; k++) score = Math.max(score, baseScore(n, tks[k]));
    if (!nameHit) score = Math.max(score, fileHit ? 320 : 120);
    score += (c.f.length ? 120 : 0) + 10 * Math.min(c.f.length, 5);
    if (majorHit) score += 80;
    if (colHit) score += 20;
    var fhits = [];
    c.f.forEach(function (f) {
      var fn = norm(f.n), ft = norm(f.t);
      for (var i = 0; i < tks.length; i++) {
        if (fn.indexOf(tks[i]) >= 0 || ft.indexOf(tks[i]) >= 0) { fhits.push(f); return; }
      }
    });
    if (!fhits.length) fhits = c.f.slice();
    return { c: c, score: score, nameHit: nameHit, fhits: fhits };
  }

  /* ---------- 数据加载 ---------- */
  fetch("data/search.json", { cache: "no-store" })
    .then(function (r) { return r.json(); })
    .then(function (d) {
      DATA = d;
      var cc = d.counts || {};
      $("stats").textContent = (cc.colleges || 0) + " 个学院 · " +
        (cc.courses || 0) + " 门课 · " + (cc.files || 0) + " 份资料";
      fillColleges();
      renderRecent();
      route();
      // 支持 ?q=关键词 直接落到搜索结果（方便分享/收藏一个搜索）
      var kw = new URLSearchParams(location.search).get("q");
      if (kw) { $("q").value = kw; doSearch(); }
    })
    .catch(function () {
      $("stats").innerHTML = "数据加载失败，请下拉刷新重试；反复失败可 <a href=\"upload.html#fb\">反馈</a>";
    });

  /* ---------- 学院三级下拉 ---------- */
  function fillColleges() {
    var seen = {}, cols = [];
    DATA.courses.forEach(function (c) {
      if (c.c === "公共课") return;
      if (!seen[c.c]) { seen[c.c] = 1; cols.push(c.c); }
    });
    cols.sort();
    var sel = $("college");
    cols.forEach(function (n) {
      var o = document.createElement("option");
      o.value = n; o.textContent = n; sel.appendChild(o);
    });
    var pubs = DATA.courses.filter(function (c) { return c.c === "公共课"; });
    if (pubs.length) {
      var og = document.createElement("option");
      og.value = "__public__"; og.textContent = "公共课（" + pubs.length + " 门）";
      sel.appendChild(og);
    }
    sel.addEventListener("change", function () {
      var v = sel.value, ms = $("major"), cs = $("course");
      ms.innerHTML = ""; cs.innerHTML = "";
      cs.disabled = true;
      cs.innerHTML = '<option value="">先选专业</option>';
      if (v === "__public__") {
        ms.disabled = true;
        ms.innerHTML = '<option value="">（公共课无专业）</option>';
        cs.disabled = false;
        cs.innerHTML = '<option value="">请选择课程</option>';
        pubs.forEach(function (c) { addOpt(cs, c.n, c.p); });
        return;
      }
      ms.disabled = false;
      ms.innerHTML = '<option value="">请选择专业</option>';
      var majors = {};
      DATA.courses.forEach(function (c) {
        if (c.c === v && c.m && !majors[c.m]) majors[c.m] = 1;
      });
      Object.keys(majors).sort().forEach(function (m) { addOpt(ms, m, m); });
    });
    $("major").addEventListener("change", function () {
      var m = this.value, cs = $("course");
      if (!m) return;
      cs.disabled = false;
      cs.innerHTML = '<option value="">请选择课程</option>';
      DATA.courses.forEach(function (c) {
        if (c.c === sel.value && c.m === m) addOpt(cs, c.n, c.p);
      });
    });
    $("course").addEventListener("change", function () {
      var p = this.value;
      if (!p) return;
      location.hash = "#/c/" + encodeURIComponent(p);
    });
  }
  function addOpt(sel, text, value) {
    var o = document.createElement("option");
    o.value = value; o.textContent = text; sel.appendChild(o);
  }


  /* ---------- 最近更新（让页面看起来是活的） ---------- */
  function relTime(ts) {
    var diff = (Date.now() / 1000) - ts;
    if (diff < 120) return "刚刚";
    if (diff < 3600) return Math.round(diff / 60) + " 分钟前";
    if (diff < 86400) return Math.round(diff / 3600) + " 小时前";
    return Math.round(diff / 86400) + " 天前";
  }
  function renderRecent() {
    var box = $("recent");
    if (!box) return;
    var items = [];
    DATA.courses.forEach(function (c) {
      c.f.forEach(function (f) { if (f.u) items.push({ c: c, f: f }); });
    });
    if (!items.length) {
      box.innerHTML = '<div class="recentempty">库里还没有资料，第一份等你来传：' +
        '<a href="upload.html">去上传</a></div>';
      return;
    }
    items.sort(function (a, b) { return b.f.u - a.f.u; });
    var html = '<div class="grp">最近更新</div>';
    items.slice(0, 5).forEach(function (it) {
      html += '<a class="fitem" href="' + viewUrl(it.c, it.f) + '" target="_blank" rel="noopener">' +
        '<span class="ft">' + esc(it.f.t) + '</span>' +
        '<span class="fn">' + esc(it.c.n) + ' · ' + esc(it.f.n) + '</span>' +
        '<span class="fa">' + relTime(it.f.u) + '</span></a>';
    });
    box.innerHTML = html;
  }

  /* ---------- 全站搜索（课程 + 资料） ---------- */
  var lastKey = "", sTimer = null, composing = false;
  function hitsWithF(c) { return c.f.length > 0; }

  function courseCard(r, key, exact) {
    var c = r.c;
    var html = '<a class="item" href="' + courseUrl(c) + '">' +
      '<div class="body"><div class="n">' + mark(c.n, key) +
      (exact ? '<span class="exact">精确</span>' : '') + '</div>' +
      '<div class="m">' + esc(pathText(c)) + '</div></div>' +
      '<span class="act">进入 ›</span></a>';
    if (c.f.length) {
      html += '<div class="subfs">';
      c.f.slice(0, 3).forEach(function (f) {
        html += '<a class="fitem" href="' + viewUrl(c, f) + '" target="_blank" rel="noopener">' +
          '<span class="ft">' + esc(f.t) + '</span>' +
          '<span class="fn">' + mark(f.n, key) + '</span>' +
          '<span class="fa">打开</span></a>';
      });
      if (c.f.length > 3) {
        html += '<a class="fmore" href="' + courseUrl(c) + '">共 ' + c.f.length +
          ' 份，还有 ' + (c.f.length - 3) + ' 份 ›</a>';
      }
      html += '</div>';
    }
    return html;
  }
  function emptyCard(c, key) {
    return '<a class="fitem" href="' + courseUrl(c) + '">' +
      '<span class="fn">' + mark(c.n, key) +
      '<span class="gone">' + esc(pathText(c)) + '</span></span>' +
      '<span class="fa">›</span></a>';
  }
  // kind 不再进 summary（轴名只在分组标题出现）；showMajor 只在学院组为 true
  function entryHtml(e, hasHit, showMajor) {
    var fs = 0;
    e.list.forEach(function (c) { fs += c.f.length; });
    var html = '<details class="entry"><summary>' + esc(e.n) + ' · ' +
      (hasHit ? '还有 ' : '') + e.list.length + ' 门课' +
      (!fs ? ' · 均无资料' : '') + '</summary>';
    e.list.slice(0, 40).forEach(function (c) {
      var right = fs ? (c.f.length ? c.f.length + ' 份' : '暂无') : '›';
      html += '<a class="fitem" href="' + courseUrl(c) + '">' +
        '<span class="fn">' + esc(c.n) +
        (showMajor ? '<span class="gone">' + esc(c.m || c.c) + '</span>' : '') +
        '</span><span class="fa">' + right + '</span></a>';
    });
    if (e.list.length > 40) html += '<div class="fmore">只列前 40 门，输入更具体的关键词</div>';
    html += '</details>';
    return html;
  }

  function searchAll(tks) {
    var hit = [], majors = {}, colleges = {}, fileCnt = 0;
    DATA.courses.forEach(function (c) {
      var r = matchCourse(c, tks);
      if (r) { hit.push(r); fileCnt += r.fhits.length; return; }
      var m = norm(c.m || ""), col = norm(c.c);
      var pathStr = col + " " + m;
      var ok = tks.length && tks.every(function (t) { return pathStr.indexOf(t) >= 0; });
      if (!ok) return;
      var inM = c.m && tks.every(function (t) { return m.indexOf(t) >= 0; });
      var inC = tks.every(function (t) { return col.indexOf(t) >= 0; });
      if (inM) {
        (majors[c.m] = majors[c.m] || { n: c.m, list: [] }).list.push(c);
      } else if (inC) {
        (colleges[c.c] = colleges[c.c] || { n: c.c, list: [] }).list.push(c);
      } else if (c.m) {
        (majors[c.m] = majors[c.m] || { n: c.m, list: [] }).list.push(c);
      } else {
        (colleges[c.c] = colleges[c.c] || { n: c.c, list: [] }).list.push(c);
      }
    });
    return { hit: hit, majors: majors, colleges: colleges, fileCnt: fileCnt };
  }

  function doSearch() {
    var raw = $("q").value.trim();
    var box = $("results");
    if (!raw) {
      box.innerHTML = "";
      $("browse").style.display = "";
      if ($("recent")) $("recent").style.display = "";
      lastKey = "";
      return;
    }
    if (raw === lastKey) return;
    lastKey = raw;
    $("browse").style.display = "none";
    if ($("recent")) $("recent").style.display = "none";
    var tks = tokens(raw);
    var nk = norm(raw);
    var res = searchAll(tks);
    var splitNote = "";
    var noRes = !res.hit.length && !Object.keys(res.majors).length && !Object.keys(res.colleges).length;
    if (noRes && tks.length === 1 && tks[0].length >= 3) {
      var one = tks[0];
      for (var si = 2; si <= one.length - 1; si++) {
        var cand = [one.slice(0, si), one.slice(si)];
        var r2 = searchAll(cand);
        if (r2.hit.length) {
          res = r2;
          tks = cand;
          splitNote = '<div class="srchsum">没找到连着的「' + esc(raw) + '」，按「' +
            esc(cand[0]) + ' + ' + esc(cand[1]) + '」拆开找了：</div>';
          break;
        }
      }
    }
    var hit = res.hit, majors = res.majors, colleges = res.colleges;
    hit.sort(function (a, b) {
      var d = b.score - a.score;
      if (d) return d;
      var fa = a.c.f.length ? 1 : 0, fb = b.c.f.length ? 1 : 0;
      if (fa !== fb) return fb - fa;
      if (a.c.n.length !== b.c.n.length) return a.c.n.length - b.c.n.length;
      return a.c.p < b.c.p ? -1 : a.c.p > b.c.p ? 1 : 0;
    });
    var hasF = [], noF = [];
    hit.forEach(function (r) { (r.c.f.length ? hasF : noF).push(r); });
    // 精确命中的空课：不进折叠，直接给一张带「精确」徽标的卡
    var exEmpty = noF.filter(function (r) { return norm(r.c.n) === nk; });
    if (exEmpty.length) {
      noF = noF.filter(function (r) { return norm(r.c.n) !== nk; });
    }
    var noFCnt = noF.length + exEmpty.length;
    var majList = Object.keys(majors).map(function (k) { return majors[k]; });
    var colList = Object.keys(colleges).map(function (k) { return colleges[k]; });
    majList.sort(function (a, b) { return b.list.length - a.list.length; });
    colList.sort(function (a, b) { return b.list.length - a.list.length; });
    var hasPath = majList.length || colList.length;
    var total = hit.length;

    var html = splitNote;
    if (total) {
      html += '<div class="srchsum">' + (hasF.length
        ? '共 <b>' + total + '</b> 门匹配：<b>' + hasF.length + '</b> 门有资料' +
        (noFCnt ? '，' + noFCnt + ' 门暂无' : '')
        : '<b>' + total + '</b> 门匹配 · 均暂无资料') + '</div>';
    } else if (hasPath) {
      html += '<div class="srchsum">没有课程名匹配，按下面继续找：</div>';
    }
    if (exEmpty.length) {
      html += '<div class="grp">精确匹配（暂无资料）</div>';
      exEmpty.forEach(function (r) { html += courseCard(r, tks, true); });
    }
    if (hasF.length) {
      html += '<div class="grp">有资料的课</div>';
      hasF.slice(0, 40).forEach(function (r) { html += courseCard(r, tks, norm(r.c.n) === nk); });
      if (hasF.length > 40) html += '<div class="fmore">共 ' + hasF.length +
        ' 门，只显示前 40 门，输入更具体的关键词</div>';
    }
    if (noF.length) {
      html += '<details class="entry"><summary>其他匹配课程均无资料（' + noFCnt + ' 门' +
        (noFCnt > 40 ? '，列前 40' : '') + '）</summary>';
      noF.slice(0, 40).forEach(function (r) { html += emptyCard(r.c, tks); });
      if (noF.length > 40) html += '<div class="fmore">只列前 40 门，输入更具体的关键词</div>';
      html += '</details>';
    }
    if (hasPath) {
      html += '<div class="grp">还可以按这些找</div>';
      if (majList.length) {
        majList.forEach(function (e) { html += entryHtml(e, !!total, false); });
      }
      colList.forEach(function (e) { html += entryHtml(e, !!total && total > 0, true); });
    }
    if (!html) {
      html = '<div class="empty">没有找到「' + esc(raw) + '」。<br>' +
        '换更短的课程名或文件名试试，或者：<br>' +
        '<a href="upload.html">去上传一份</a> · <a href="#/">按学院浏览</a></div>';
    }
    box.innerHTML = html;
  }

  function scheduleSearch() {
    if (sTimer) clearTimeout(sTimer);
    sTimer = setTimeout(function () { sTimer = null; doSearch(); }, 150);
  }
  $("q").addEventListener("compositionstart", function () { composing = true; });
  $("q").addEventListener("compositionend", function () { composing = false; scheduleSearch(); });
  $("q").addEventListener("input", function () {
    if (!this.value.trim()) { doSearch(); return; }
    if (!composing) scheduleSearch();
  });
  $("q").addEventListener("keydown", function (e) {
    if (e.key === "Enter") { if (sTimer) clearTimeout(sTimer); doSearch(); this.blur(); }
  });
  $("go").addEventListener("click", function () { if (sTimer) clearTimeout(sTimer); doSearch(); });

  /* ---------- 课程详情（类型筛选 + 本课搜索） ---------- */
  var state = { type: "" };

  function showCourse(c) {
    $("home").style.display = "none";
    var box = $("courseview");
    box.style.display = "";
    state.type = "";

    var crumb = '<a href="#/">首页</a> › ' + esc(pathText(c)) + ' › ' + esc(c.n);
    var head = '<div class="crumb">' + crumb + '</div>' +
      '<div class="cname">' + esc(c.n) + '</div>' +
      '<div class="tags"><a class="plainlink" href="' + giteeDirUrl(c) + '" target="_blank" rel="noopener">在仓库里打开</a></div>' +
      '<div class="chips" id="chips"></div>' +
      '<div class="searchbar"><input id="cq" type="search" placeholder="在这门课里搜资料（如 第一章 / 期末）" autocomplete="off">' +
      '<button id="cgo">搜索</button></div>' +
      '<div id="clist"></div>';
    box.innerHTML = head;

    function drawChips() {
      var html = '<span class="chiplabel">按类型</span>' +
        '<span class="chip' + (state.type ? "" : " on") + '" data-t="">全部 ' + c.f.length + '</span>';
      TYPES.forEach(function (t) {
        var n = c.f.filter(function (f) { return f.t === t; }).length;
        html += '<span class="chip' + (state.type === t ? " on" : "") + '" data-t="' + t + '">' +
          t + ' ' + n + '</span>';
      });
      var wrap = $("chips");
      wrap.innerHTML = html;
      Array.prototype.forEach.call(wrap.querySelectorAll(".chip"), function (el) {
        el.addEventListener("click", function () {
          state.type = el.getAttribute("data-t");
          $("cq").placeholder = state.type
            ? "在「" + state.type + "」里搜（如 第一章）"
            : "在这门课里搜资料（如 第一章 / 期末）";
          drawChips();
          render($("cq").value.trim());
        });
      });
    }

    function render(key) {
      var groups = {}, total = 0;
      c.f.forEach(function (f) {
        if (state.type && f.t !== state.type) return;
        if (key && (norm(f.n).indexOf(norm(key)) < 0 &&
                    norm(f.t).indexOf(norm(key)) < 0)) return;
        (groups[f.t] = groups[f.t] || []).push(f);
        total++;
      });
      var html = "";
      if (!total) {
        html = '<div class="empty">' + (key ? '这里没有匹配的资料' :
          (state.type ? '这个类型下还没有资料，欢迎第一个上传' : '这门课还没有资料，欢迎第一个上传')) +
          '<br><a href="upload.html?course=' + encodeURIComponent(c.p) + '">去上传</a></div>';
      }
      TYPES.forEach(function (t) {
        var arr = groups[t];
        if (!arr) return;
        html += '<div class="grp">' + t + (key ? '（' + arr.length + '）' : '') + '</div>';
        arr.forEach(function (f) {
          html += fileItem(c, f, key);
        });
      });
      $("clist").innerHTML = html;
    }
    drawChips();
    render("");
    $("cq").addEventListener("input", function () { render(this.value.trim()); });
    $("cq").addEventListener("keydown", function (e) { if (e.key === "Enter") { this.blur(); } });
    $("cgo").addEventListener("click", function () { render($("cq").value.trim()); });
    window.scrollTo(0, 0);
  }

  /* ---------- 路由 ---------- */
  function route() {
    if (!DATA) return;
    var h = location.hash || "";
    if (h.indexOf("#/c/") === 0) {
      var p = decodeURIComponent(h.slice(4));
      var c = DATA.courses.filter(function (x) { return x.p === p; })[0];
      if (c) return showCourse(c);
    }
    $("courseview").style.display = "none";
    $("home").style.display = "";
  }
  window.addEventListener("hashchange", route);
})();
</script>
