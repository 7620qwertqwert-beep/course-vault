<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>信师大南湖课栈 · 找资料</title>
<link rel="icon" href="data:,">

<style>
  :root{--pink:#c2466b;--ink:#222;--muted:#7b7b7b;--line:#e6e6e6;--bg:#fafafa}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:16px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
  .wrap{max-width:760px;margin:0 auto;padding:14px 14px 44px}
  header{text-align:center;padding:12px 0 4px}
  h1{font-size:21px;margin:0 0 4px}
  .sub{color:var(--muted);font-size:12.5px}
  .searchbar{display:flex;gap:8px;margin:14px 0 6px}
  .searchbar input{flex:1;min-width:0;padding:13px 14px;font-size:16px;color:var(--ink);
      border:1px solid var(--line);border-radius:12px;background:#fff;-webkit-appearance:none}
  .searchbar input:focus{outline:none;border-color:var(--pink)}
  .searchbar button{flex:0 0 auto;padding:0 18px;font-size:16px;border:none;border-radius:12px;
      background:var(--pink);color:#fff}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:12px 0}
  .row{margin:10px 0}
  .row:first-child{margin-top:0}
  label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:6px}
  select{width:100%;padding:12px;font-size:16px;color:var(--ink);
      border:1px solid var(--line);border-radius:12px;background:#fff;-webkit-appearance:none}
  .grp{font-size:13px;color:var(--muted);margin:18px 2px 6px}
  .item{display:flex;align-items:center;gap:10px;padding:10px 13px;margin:8px 0;border:1px solid var(--line);
      border-radius:12px;background:#fff;text-decoration:none;color:inherit}
  .item:active{background:#fff5f8}
  .item .body{flex:1;min-width:0}
  .item .n{font-weight:600;word-break:break-all}
  .item .m{font-size:12.5px;color:var(--muted);margin-top:3px}
  .item .act{flex:0 0 auto;color:var(--pink);font-size:13px;margin-left:8px}
  .thumb{width:54px;height:54px;flex:0 0 auto;object-fit:cover;border-radius:8px;background:#f4f4f4}
  .empty{color:var(--muted);text-align:center;padding:26px 8px;font-size:14px}
  .empty a{color:var(--pink)}
  .crumb{font-size:12.5px;color:var(--muted);margin:12px 2px 4px}
  .crumb a{color:var(--pink);text-decoration:none}
  .cname{font-size:19px;font-weight:700;margin:2px 0 0;word-break:break-all}
  .tags{margin:8px 0 2px}
  .chips{display:flex;flex-wrap:wrap;align-items:center;gap:0 2px;margin:6px 0 2px}
  .chiplabel{font-size:12px;color:var(--muted);margin-right:6px}
  .chip{display:inline-flex;align-items:center;min-height:44px;padding:0 6px;
      font-size:13.5px;color:var(--muted);cursor:pointer}
  .chip.on{color:var(--pink);font-weight:600}
  .plainlink{font-size:13px;color:var(--ink);text-decoration:none}
  mark{background:#ffe0e8;color:inherit;border-radius:3px}
  footer{margin-top:28px;text-align:center;font-size:13px;color:var(--muted)}
  footer a{color:var(--pink);text-decoration:none;margin:0 6px}
  .note{font-size:12.5px;color:var(--muted);text-align:center;margin-top:10px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>信师大<span>南湖课栈</span></h1>
    <div class="sub" id="stats">加载中…</div>
  </header>

  <!-- 首页 -->
  <div id="home">
    <div class="searchbar">
      <input id="q" type="search" placeholder="搜课程或资料：康复评定 / 骨绘画 / 期末" autocomplete="off" enterkeyhint="search">
      <button id="go">搜索</button>
    </div>
    <div id="results"></div>

    <div id="browse">
      <div class="card">
        <div class="row"><label>学院</label>
          <select id="college"><option value="">请选择学院</option></select></div>
        <div class="row"><label>专业</label>
          <select id="major" disabled><option value="">先选学院</option></select></div>
        <div class="row"><label>课程</label>
          <select id="course" disabled><option value="">先选专业</option></select></div>
      </div>
    </div>
  </div>

  <!-- 课程详情 -->
  <div id="courseview" style="display:none"></div>

  <footer>
    <a href="upload.html">上传资料</a> ·
    <a href="https://gitee.com/youliboshi/course-vault">仓库首页</a> ·
    <a href="https://gitee.com/youliboshi/course-vault/blob/main/INDEX.md">全部课程索引</a>
    <div class="note">只收课程学习资料，别传个人信息。</div>
  </footer>
</div>

<script>
(function () {
  var REPO = "https://gitee.com/youliboshi/course-vault";
  var RAW = REPO + "/raw/main/";
  var TYPES = ["笔记", "课件", "试卷", "作业", "实验报告", "复习资料"];
  var DATA = null;

  function $(id) { return document.getElementById(id); }
  var AMP = String.fromCharCode(38), QUOT = String.fromCharCode(34);
  function esc(s) {
    return String(s == null ? "" : s)
      .split(AMP).join(AMP + "amp;")
      .split("<").join(AMP + "lt;")
      .split(">").join(AMP + "gt;")
      .split(QUOT).join(AMP + "quot;");
  }
  function encPath(p) { return p.split("/").map(encodeURIComponent).join("/"); }
  // 下载走本站静态目录（/courses/...）。Gitee raw 有防盗链：带 Referer 过去会 403。
  function rawUrl(c, f) { return "/" + encPath(c.p + "/" + f.t + "/" + f.n); }
  // 站内查看页：md/pdf/图片都在页面里直接打开，另有「下载原件」
  function viewUrl(c, f) { return "view.html?p=" + encodeURIComponent(c.p + "/" + f.t + "/" + f.n); }
  var IMG_RE = /\.(jpe?g|png|webp)$/i;
  function thumbUrl(c, f) {
    var rel = (c.p + "/" + f.t + "/" + f.n).replace(/\.[^.]+$/, ".jpg");
    return "/_thumb/" + encPath(rel);
  }
  // 统一生成一条资料条目：图片带 54px 缩略图（不占多少版面，也不进仓库）
  function fileItem(c, f, key, prefix) {
    var img = IMG_RE.test(f.n)
      ? '<img class="thumb" loading="lazy" alt="" src="' + thumbUrl(c, f) + '">'
      : "";
    var meta = (prefix ? prefix + " › " : "") + f.t + " · " + sizeText(f.s);
    return '<a class="item" href="' + viewUrl(c, f) + '" target="_blank" rel="noopener">' + img +
      '<div class="body"><div class="n">' + mark(f.n, key) + '</div>' +
      '<div class="m">' + esc(meta) + '</div></div>' +
      '<span class="act">打开</span></a>';
  }
  function courseUrl(c) { return "#/c/" + encodeURIComponent(c.p); }
  function giteeDirUrl(c) { return REPO + "/tree/main/" + encPath(c.p); }
  function sizeText(n) {
    if (!n && n !== 0) return "";
    if (n < 1024) return n + " B";
    if (n < 1024 * 1024) return (n / 1024).toFixed(0) + " KB";
    return (n / 1024 / 1024).toFixed(1) + " MB";
  }
  function pathText(c) {
    return c.m ? (c.c + " › " + c.m) : "公共课";
  }
  function mark(text, key) {
    var safe = esc(text);
    if (!key) return safe;
    var i = safe.toLowerCase().indexOf(esc(key).toLowerCase());
    if (i < 0) return safe;
    var len = esc(key).length;
    return safe.slice(0, i) + "<mark>" + safe.slice(i, i + len) + "</mark>" + safe.slice(i + len);
  }

  /* ---------- 数据加载 ---------- */
  fetch("data/search.json", { cache: "no-store" })
    .then(function (r) { return r.json(); })
    .then(function (d) {
      DATA = d;
      var cc = d.counts || {};
      $("stats").textContent = (cc.colleges || 0) + " 个学院 · " +
        (cc.courses || 0) + " 门课 · " + (cc.files || 0) + " 份资料";
      fillColleges();
      route();
      // 支持 ?q=关键词 直接落到搜索结果（方便分享/收藏一个搜索）
      var kw = new URLSearchParams(location.search).get("q");
      if (kw) { $("q").value = kw; doSearch(); }
    })
    .catch(function () {
      $("stats").textContent = "数据加载失败，请下拉刷新重试";
    });

  /* ---------- 学院三级下拉 ---------- */
  function fillColleges() {
    var seen = {}, cols = [];
    DATA.courses.forEach(function (c) {
      if (c.c === "公共课") return;
      if (!seen[c.c]) { seen[c.c] = 1; cols.push(c.c); }
    });
    cols.sort();
    var sel = $("college");
    cols.forEach(function (n) {
      var o = document.createElement("option");
      o.value = n; o.textContent = n; sel.appendChild(o);
    });
    var pubs = DATA.courses.filter(function (c) { return c.c === "公共课"; });
    if (pubs.length) {
      var og = document.createElement("option");
      og.value = "__public__"; og.textContent = "公共课（" + pubs.length + " 门）";
      sel.appendChild(og);
    }
    sel.addEventListener("change", function () {
      var v = sel.value, ms = $("major"), cs = $("course");
      ms.innerHTML = ""; cs.innerHTML = "";
      cs.disabled = true;
      cs.innerHTML = '<option value="">先选专业</option>';
      if (v === "__public__") {
        ms.disabled = true;
        ms.innerHTML = '<option value="">（公共课无专业）</option>';
        cs.disabled = false;
        cs.innerHTML = '<option value="">请选择课程</option>';
        pubs.forEach(function (c) { addOpt(cs, c.n, c.p); });
        return;
      }
      ms.disabled = false;
      ms.innerHTML = '<option value="">请选择专业</option>';
      var majors = {};
      DATA.courses.forEach(function (c) {
        if (c.c === v && c.m && !majors[c.m]) majors[c.m] = 1;
      });
      Object.keys(majors).sort().forEach(function (m) { addOpt(ms, m, m); });
    });
    $("major").addEventListener("change", function () {
      var m = this.value, cs = $("course");
      if (!m) return;
      cs.disabled = false;
      cs.innerHTML = '<option value="">请选择课程</option>';
      DATA.courses.forEach(function (c) {
        if (c.c === sel.value && c.m === m) addOpt(cs, c.n, c.p);
      });
    });
    $("course").addEventListener("change", function () {
      var p = this.value;
      if (!p) return;
      location.hash = "#/c/" + encodeURIComponent(p);
    });
  }
  function addOpt(sel, text, value) {
    var o = document.createElement("option");
    o.value = value; o.textContent = text; sel.appendChild(o);
  }

  /* ---------- 全站搜索（课程 + 资料） ---------- */
  function doSearch() {
    var key = $("q").value.trim();
    var box = $("results");
    if (!key) {
      box.innerHTML = "";
      $("browse").style.display = "";
      return;
    }
    $("browse").style.display = "none";

    var courses = [], files = [];
    DATA.courses.forEach(function (c) {
      var label = pathText(c) + " " + c.n;
      if (label.toLowerCase().indexOf(key.toLowerCase()) >= 0) courses.push(c);
      c.f.forEach(function (f) {
        if (f.n.toLowerCase().indexOf(key.toLowerCase()) >= 0) {
          files.push({ c: c, f: f });
        }
      });
    });

    var html = "";
    if (courses.length) {
      html += '<div class="grp">课程（' + courses.length + '）</div>';
      courses.slice(0, 40).forEach(function (c) {
        html += '<a class="item" href="' + courseUrl(c) + '">' +
          '<div class="body"><div class="n">' + mark(c.n, key) + '</div>' +
          '<div class="m">' + esc(pathText(c)) + ' · ' + c.f.length + ' 份资料</div></div>' +
          '<span class="act">进入 ›</span></a>';
      });
      if (courses.length > 40) html += '<div class="empty">只显示前 40 门，换个更具体的关键词</div>';
    }
    if (files.length) {
      html += '<div class="grp">资料（' + files.length + '）</div>';
      files.slice(0, 60).forEach(function (it) {
        html += fileItem(it.c, it.f, key, pathText(it.c) + " › " + it.c.n);
      });
    }
    if (!courses.length && !files.length) {
      html = '<div class="empty">没有找到「' + esc(key) + '」。<br>' +
        '试试课程名的一部分（如「解剖」），或去 <a href="' + REPO + '">仓库首页</a> 按目录翻。</div>';
    }
    box.innerHTML = html;
  }
  $("q").addEventListener("input", function () { if (!this.value.trim()) doSearch(); });
  $("q").addEventListener("keydown", function (e) { if (e.key === "Enter") { doSearch(); this.blur(); } });
  $("go").addEventListener("click", function () { doSearch(); });

  /* ---------- 课程详情（类型筛选 + 本课搜索） ---------- */
  var state = { type: "" };

  function showCourse(c) {
    $("home").style.display = "none";
    var box = $("courseview");
    box.style.display = "";
    state.type = "";

    var crumb = '<a href="#/">首页</a> › ' + esc(pathText(c)) + ' › ' + esc(c.n);
    var head = '<div class="crumb">' + crumb + '</div>' +
      '<div class="cname">' + esc(c.n) + '</div>' +
      '<div class="tags"><a class="plainlink" href="' + giteeDirUrl(c) + '" target="_blank" rel="noopener">在仓库里打开</a></div>' +
      '<div class="chips" id="chips"></div>' +
      '<div class="searchbar"><input id="cq" type="search" placeholder="在这门课里搜资料（如 第一章 / 期末）" autocomplete="off">' +
      '<button id="cgo">搜索</button></div>' +
      '<div id="clist"></div>';
    box.innerHTML = head;

    function drawChips() {
      var html = '<span class="chiplabel">按类型</span>' +
        '<span class="chip' + (state.type ? "" : " on") + '" data-t="">全部 ' + c.f.length + '</span>';
      TYPES.forEach(function (t) {
        var n = c.f.filter(function (f) { return f.t === t; }).length;
        html += '<span class="chip' + (state.type === t ? " on" : "") + '" data-t="' + t + '">' +
          t + ' ' + n + '</span>';
      });
      var wrap = $("chips");
      wrap.innerHTML = html;
      Array.prototype.forEach.call(wrap.querySelectorAll(".chip"), function (el) {
        el.addEventListener("click", function () {
          state.type = el.getAttribute("data-t");
          $("cq").placeholder = state.type
            ? "在「" + state.type + "」里搜（如 第一章）"
            : "在这门课里搜资料（如 第一章 / 期末）";
          drawChips();
          render($("cq").value.trim());
        });
      });
    }

    function render(key) {
      var groups = {}, total = 0;
      c.f.forEach(function (f) {
        if (state.type && f.t !== state.type) return;
        if (key && (f.n.toLowerCase().indexOf(key.toLowerCase()) < 0 &&
                    f.t.toLowerCase().indexOf(key.toLowerCase()) < 0)) return;
        (groups[f.t] = groups[f.t] || []).push(f);
        total++;
      });
      var html = "";
      if (!total) {
        html = '<div class="empty">' + (key ? '这里没有匹配的资料' :
          (state.type ? '这个类型下还没有资料，欢迎第一个上传' : '这门课还没有资料，欢迎第一个上传')) +
          '<br><a href="upload.html">去上传</a></div>';
      }
      TYPES.forEach(function (t) {
        var arr = groups[t];
        if (!arr) return;
        html += '<div class="grp">' + t + (key ? '（' + arr.length + '）' : '') + '</div>';
        arr.forEach(function (f) {
          html += fileItem(c, f, key);
        });
      });
      $("clist").innerHTML = html;
    }
    drawChips();
    render("");
    $("cq").addEventListener("input", function () { render(this.value.trim()); });
    $("cq").addEventListener("keydown", function (e) { if (e.key === "Enter") { this.blur(); } });
    $("cgo").addEventListener("click", function () { render($("cq").value.trim()); });
    window.scrollTo(0, 0);
  }

  /* ---------- 路由 ---------- */
  function route() {
    if (!DATA) return;
    var h = location.hash || "";
    if (h.indexOf("#/c/") === 0) {
      var p = decodeURIComponent(h.slice(4));
      var c = DATA.courses.filter(function (x) { return x.p === p; })[0];
      if (c) return showCourse(c);
    }
    $("courseview").style.display = "none";
    $("home").style.display = "";
  }
  window.addEventListener("hashchange", route);
})();
</script>
</body>
</html>
