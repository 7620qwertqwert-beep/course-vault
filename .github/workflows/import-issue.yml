name: Issue 自动归档

"on":
  issues:
    types: [labeled]

permissions:
  # 归档需要写内容、写 PR、写 Issue；
  # actions: write 用于「显式触发 check.yml 并等待结果」——
  # 机器人用 GITHUB_TOKEN 建的 PR 不会自动触发 pull_request 事件。
  contents: write
  pull-requests: write
  issues: write
  actions: write

# 同一个 Issue 的重复触发串行执行；job 级再按仓库串行，避免两个 Issue
# 同时改到同一门课目录。cancel-in-progress=false：不打断已经开始的归档。
concurrency:
  group: import-issue-${{ github.repository }}-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  import:
    name: 归档 Issue 附件
    if: >-
      github.event.label.name == 'approved' &&
      github.event.issue.state == 'open' &&
      !contains(github.event.issue.labels.*.name, '已入库')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: import-courses-${{ github.repository }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      GH_REPO: ${{ github.repository }}
      GH_PROMPT_DISABLED: "1"
      GIT_TERMINAL_PROMPT: "0"
      PYTHONIOENCODING: utf-8
      ISSUE_NUMBER: ${{ github.event.issue.number }}

    steps:
      # 同一个 Issue 如果已经有未合并的归档 PR，直接跳过，避免重复入库/重复 PR。
      - name: 检查是否已有归档 PR
        id: guard
        shell: bash
        run: |
          set -euo pipefail
          existing="$(gh pr list --state open --limit 100 \
            --json number,headRefName,isCrossRepository \
            --jq ".[] | select((.isCrossRepository | not) and ((.headRefName == \"issue-${ISSUE_NUMBER}\") or (.headRefName | startswith(\"issue-${ISSUE_NUMBER}-\")))) | .number" \
            | head -n 1)"
          if [ -n "$existing" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "已有归档 PR #$existing，跳过重复导入。"
            gh issue comment "$ISSUE_NUMBER" \
              --body "已有未合并的归档 PR #${existing}，本次不重复导入；请等待维护者合并。若要重跑：先关闭旧 PR，再把这个 Issue 上的 approved 标签移除、然后重新加上。" \
              || true
            gh issue edit "$ISSUE_NUMBER" --add-label "已入库" || true
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # 只从 main 取可信的归档脚本；Issue 正文里的内容不会被执行。
      - name: 检出 main
        if: steps.guard.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: 运行归档脚本
        id: import
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          # /tmp 在同一个 job 的所有 step 之间共享；失败 step 读取同一路径。
          python3 scripts/import_issue.py --issue-number "$ISSUE_NUMBER" 2>&1 | tee /tmp/import.log

          ok_line="$(grep -m1 '^IMPORT_OK ' /tmp/import.log || true)"
          if [ -z "$ok_line" ]; then
            echo "::error::归档脚本没有输出 IMPORT_OK"
            exit 1
          fi

          result="${ok_line#IMPORT_OK }"
          count="${result##* }"
          target="${result% *}"
          case "$count" in
            ''|*[!0-9]*)
              echo "::error::无法解析 IMPORT_OK 里的文件数：$ok_line"
              exit 1
              ;;
          esac
          if [ ! -d "$target" ]; then
            echo "::error::脚本报告的目标目录不存在：$target"
            exit 1
          fi
          case "$target" in
            courses/*) ;;
            *)
              echo "::error::目标目录不在 courses/ 下：$target"
              exit 1
              ;;
          esac

          course="$(sed -n 's/^IMPORT_META course=//p' /tmp/import.log | head -n 1)"
          year="$(sed -n 's/^IMPORT_META year=//p' /tmp/import.log | head -n 1)"
          type="$(sed -n 's/^IMPORT_META type=//p' /tmp/import.log | head -n 1)"
          if [ -z "$course" ] || [ -z "$year" ] || [ -z "$type" ]; then
            echo "::error::无法从脚本输出中解析课程 / 年份学期 / 资料类型"
            exit 1
          fi

          {
            echo "target=$target"
            echo "count=$count"
            echo "course=$course"
            echo "year=$year"
            echo "type=$type"
          } >> "$GITHUB_OUTPUT"

          echo "已归档到：$target（$count 个文件）"

      - name: 本地预检（结构与内容，先失败不建 PR）
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/check.sh
          python3 scripts/build_index.py --check

      - name: 提交到分支并创建 PR
        id: pr
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        env:
          TARGET: ${{ steps.import.outputs.target }}
          COUNT: ${{ steps.import.outputs.count }}
          COURSE: ${{ steps.import.outputs.course }}
          YEAR: ${{ steps.import.outputs.year }}
          TYPE: ${{ steps.import.outputs.type }}
        run: |
          set -euo pipefail

          # 用 -f 覆盖 .gitignore（允许 20MB 以内的 zip；体积已由脚本校验）。
          git add -f -- "$TARGET"

          # 防御性检查：暂存区只允许出现脚本报告的目标目录下的文件。
          while IFS= read -r -d '' path; do
            case "$path" in
              "$TARGET"/*) ;;
              *)
                echo "::error::暂存区出现目标目录以外的文件：$path"
                exit 1
                ;;
            esac
          done < <(git diff --cached --name-only -z)

          staged_count="$(git diff --cached --name-only -z | tr '\0' '\n' | wc -l | tr -d ' ')"
          if [ "$staged_count" -ne "$COUNT" ]; then
            echo "::error::脚本报告归档 $COUNT 个文件，但暂存区有 $staged_count 个；已停止。"
            exit 1
          fi

          if git diff --cached --quiet; then
            echo "没有检测到文件变化，不创建 PR。"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            gh issue comment "$ISSUE_NUMBER" --body "没有检测到需要归档的新文件（可能已经入库）。" || true
            gh issue edit "$ISSUE_NUMBER" --add-label "已入库" || true
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          branch="issue-${ISSUE_NUMBER}"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            # 同一 Issue 重跑时避免覆盖已有分支。
            branch="${branch}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          fi
          git switch -c "$branch"
          # title 里的 COURSE/YEAR/TYPE 已在脚本中校验为单行，且始终作为
          # 参数传给 git/gh（不在 shell 里 eval），不存在命令替换注入。
          title="add: ${COURSE} ${YEAR} ${TYPE}（来自 Issue #${ISSUE_NUMBER}）"
          git commit -m "$title"
          git push -u origin "$branch"

          {
            printf 'Closes #%s\n\n' "$ISSUE_NUMBER"
            printf '## 🤖 自动归档\n\n'
            printf -- '- 课程：%s\n' "$COURSE"
            printf -- '- 年份学期：%s\n' "$YEAR"
            printf -- '- 资料类型：%s\n' "$TYPE"
            printf -- '- 来源 Issue：#%s\n' "$ISSUE_NUMBER"
            printf '\n<details><summary>Import 日志</summary>\n\n<pre>\n'
            # 日志里可能含 Issue 标题；做 HTML 转义后再放进 <pre>，
            # 避免标题里的 Markdown/HTML 破坏 PR 正文。
            sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g' /tmp/import.log
            printf '\n</pre>\n</details>\n'
          } > /tmp/pr_body.md

          pr_url="$(gh pr create --base main --head "$branch" --title "$title" --body-file /tmp/pr_body.md)"
          pr_number="${pr_url##*/}"
          case "$pr_number" in
            ''|*[!0-9]*)
              echo "::error::无法从 gh pr create 的输出解析 PR 编号：$pr_url"
              exit 1
              ;;
          esac
          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "已创建 PR #$pr_number（分支 $branch）"
      # 机器人用 GITHUB_TOKEN 建的 PR 不会自动触发 pull_request 事件（GitHub 的防递归规则），
      # 所以这里显式触发一次 check.yml，等它跑完再合并；
      # 否则 auto-merge 会永远停在 "Waiting for status to be reported"。
      - name: 触发结构与内容检查并合并
        if: steps.guard.outputs.skip != 'true' && steps.pr.outputs.changed == 'true'
        shell: bash
        env:
          BRANCH: ${{ steps.pr.outputs.branch }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
        run: |
          set -euo pipefail
          gh workflow run check.yml --ref "$BRANCH" || { echo "::error::无法触发 check.yml"; exit 1; }
          conclusion=""
          for i in $(seq 1 40); do
            sleep 15
            info="$(gh run list --workflow check.yml --branch "$BRANCH" --limit 1 \
              --json status,conclusion --jq '.[0] | "\(.status)|\(.conclusion)"' 2>/dev/null || true)"
            status="${info%%|*}"
            conc="${info##*|}"
            echo "第 $i 次：status=$status conclusion=$conc"
            if [ "$status" = "completed" ]; then conclusion="$conc"; break; fi
          done
          if [ "$conclusion" != "success" ]; then
            gh pr comment "$PR_NUMBER" --body "结构与内容检查未通过（结论：${conclusion:-超时未跑完}），已停止自动合并。修好后再触发一次。" || true
            gh issue comment "$ISSUE_NUMBER" --body "生成的 PR #${PR_NUMBER} 没通过结构与内容检查（结论：${conclusion:-超时未跑完}），已停止合并；详情见该 PR 的检查日志。" || true
            echo "::error::检查未通过：${conclusion:-超时}"
            exit 1
          fi
          gh pr merge "$PR_NUMBER" --squash
          echo "检查通过并已合并 PR #$PR_NUMBER"

      - name: 通知 Issue 并添加已入库标签
        if: steps.guard.outputs.skip != 'true' && steps.pr.outputs.changed == 'true'
        shell: bash
        env:
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
        run: |
          set -euo pipefail
          gh label create "已入库" --color 0E8A16 --description "机器人已生成归档 PR 并合并" --force >/dev/null 2>&1 || true
          gh issue comment "$ISSUE_NUMBER" --body "已生成 PR #${PR_NUMBER}，结构与内容检查通过后已自动合并入库。"
          gh issue edit "$ISSUE_NUMBER" --add-label "已入库"

      - name: 失败时通知 Issue
        if: failure()
        shell: bash
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set +e
          reason="自动归档流程执行失败，请查看 Actions 日志：${RUN_URL}"
          if [ -f /tmp/import.log ]; then
            fail_line="$(grep -m1 '^IMPORT_FAIL ' /tmp/import.log || true)"
            if [ -n "$fail_line" ]; then
              reason="${fail_line#IMPORT_FAIL }"
            fi
          fi
          # 失败原因来自外部文本，压成单行并限长，避免控制字符/超长内容刷屏。
          reason="$(printf '%s' "$reason" | tr -d '\000-\010\013\014\016-\037\177' | tr '\r\n' '  ' | cut -c1-500)"

          body="❌ 自动归档失败：${reason}"$'\n\n'"修正后请维护者移除「入库失败」标签，再重新添加「approved」标签触发归档。"
          gh label create "入库失败" --color B60205 --description "自动归档失败" --force >/dev/null 2>&1 || true
          gh issue comment "$ISSUE_NUMBER" --body "$body" || true
          gh issue edit "$ISSUE_NUMBER" --add-label "入库失败" || true
