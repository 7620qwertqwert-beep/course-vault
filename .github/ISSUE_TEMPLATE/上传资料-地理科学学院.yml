      description: "填成 20xx + 春/秋，例如 2023春、2025秋、2026秋。填你实际上课的那个学期。"
      placeholder: "2025秋"
    validations:
      required: true

  - type: dropdown
    id: material_type
    attributes:
      label: 资料类型
      description: "这份资料是什么，决定放进课程下的哪个文件夹。"
      options:
        - "笔记"
        - "课件"
        - "试卷"
        - "作业"
        - "实验报告"
        - "复习资料"
