    id: category
    attributes:
      label: 课程类别
      description: "本模板固定为专业课，无需选择。"
      default: 0
      options:
        - "专业课"
    validations:
      required: true

  - type: input
    id: college
    attributes:
      label: 开课学院
      description: "已预填为本模板的学院；一般不用改。"
      value: "地理科学学院"
    validations:
      required: true

  - type: dropdown
    id: major
    attributes:
      label: 所属专业
      description: "先选你所在的专业，下一步的课程下拉会按这个专业核对。"
      options:
