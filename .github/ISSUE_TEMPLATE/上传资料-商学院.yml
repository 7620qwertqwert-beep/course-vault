# 由 scripts/gen_forms.py 自动生成，请勿手工编辑
name: "上传资料 · 商学院"
description: "学院已填好，先选专业，再选课程。"
title: "[上传] "
labels: ["待入库"]
body:
  - type: dropdown
    id: category
    attributes:
      label: 课程类别
      description: "本模板固定为专业课，无需选择。"
      default: 0
      options:
        - "专业课"
    validations:
      required: true

  - type: input
    id: college
    attributes:
      label: 开课学院
      description: "已预填为本模板的学院；一般不用改。"
      value: "商学院"
    validations:
      required: true

  - type: dropdown
    id: major
    attributes:
      label: 所属专业
      description: "先选你所在的专业，下一步的课程下拉会按这个专业核对。"
      options:
        - "会计学"
        - "国际经济与贸易"
        - "市场营销"
        - "数字经济"
        - "经济学"
        - "金融工程"
    validations:
      required: true

  - type: dropdown
    id: course
    attributes:
      label: 课程名称
      description: "先在上一步选专业，然后在这里挑课程；每项前面是它所属的专业。只列出本学院的课程。"
      options:
        - "会计学 · 中级财务会计"
        - "会计学 · 会计信息系统"
        - "会计学 · 基础会计"
        - "会计学 · 审计学"
        - "会计学 · 微观经济学"
        - "会计学 · 成本会计"
        - "会计学 · 智能会计"
        - "会计学 · 管理会计"
        - "会计学 · 管理学"
        - "会计学 · 财务管理"
        - "会计学 · 财经法规与会计职业道德"
        - "会计学 · 高级财务会计"
        - "数字经济 · 区域经济学"
        - "数字经济 · 发展经济学"
        - "数字经济 · 商业数据科学"
        - "数字经济 · 宏观经济学"
        - "数字经济 · 平台经济学"
        - "数字经济 · 微观经济学"
        - "数字经济 · 政治经济学"
        - "数字经济 · 数字经济概论"
        - "数字经济 · 数据库原理及应用"
        - "数字经济 · 数据挖掘及应用"
        - "数字经济 · 电子商务"
        - "数字经济 · 统计学"
        - "数字经济 · 计量经济学"
        - "数字经济 · 财务数据分析"
        - "经济学 · 宏观经济学"
        - "经济学 · 微观经济学"
        - "经济学 · 政治经济学"
        - "经济学 · 经济史"
        - "经济学 · 经济思想史"
        - "经济学 · 计量经济学"
        - "经济学 · 财政学"
        - "经济学 · 金融学"
        - "金融工程 · 会计学"
        - "金融工程 · 公司金融"
        - "金融工程 · 国际金融学"
        - "金融工程 · 宏观经济学"
        - "金融工程 · 微观经济学"
        - "金融工程 · 投资银行学"
