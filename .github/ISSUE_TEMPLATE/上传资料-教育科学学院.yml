# 由 scripts/gen_forms.py 自动生成，请勿手工编辑
name: "上传资料 · 教育科学学院"
description: "学院已填好，先选专业，再选课程。"
title: "[上传] "
labels: ["待入库"]
body:
  - type: dropdown
    id: category
    attributes:
      label: 课程类别
      description: "本模板固定为专业课，无需选择。"
      default: 0
      options:
        - "专业课"
    validations:
      required: true

  - type: input
    id: college
    attributes:
      label: 开课学院
      description: "已预填为本模板的学院；一般不用改。"
      value: "教育科学学院"
    validations:
      required: true

  - type: dropdown
    id: major
    attributes:
      label: 所属专业
      description: "先选你所在的专业，下一步的课程下拉会按这个专业核对。"
      options:
        - "学前教育"
        - "心理学"
        - "教育学"
        - "教育技术学"
    validations:
      required: true

  - type: dropdown
    id: course
    attributes:
      label: 课程名称
      description: "先在上一步选专业，然后在这里挑课程；每项前面是它所属的专业。只列出本学院的课程。"
      options:
        - "学前教育 · 中外学前教育史"
        - "学前教育 · 儿童心理学"
        - "学前教育 · 学前卫生学"
        - "学前教育 · 学前教育学"
        - "学前教育 · 学前教育研究方法"
        - "学前教育 · 学年论文"
        - "学前教育 · 幼儿园活动设计与指导"
        - "学前教育 · 幼儿园课程"
        - "学前教育 · 幼儿游戏理论与指导"
        - "学前教育 · 教育实践（教育见习、教育实习和教育研习）"
        - "学前教育 · 毕业论文"
        - "心理学 · 人格心理学"
        - "心理学 · 发展心理学"
        - "心理学 · 咨询心理学"
        - "心理学 · 实验心理学"
        - "心理学 · 心理与教育研究方法"
        - "心理学 · 心理与教育统计学"
        - "心理学 · 心理学史"
        - "心理学 · 心理测量学"
        - "心理学 · 教育心理学"
        - "心理学 · 普通心理学"
        - "心理学 · 生理心理学"
        - "心理学 · 管理心理学"
        - "教育学 · 中国教育史"
        - "教育学 · 外国教育史"
        - "教育学 · 德育原理"
        - "教育学 · 教育哲学"
        - "教育学 · 教育学原理"
        - "教育学 · 教育心理学"
        - "教育学 · 教育科学研究方法"
        - "教育学 · 现代教学论"
        - "教育学 · 现代课程论"
        - "教育技术学 · 人工智能教育应用"
        - "教育技术学 · 信息技术与课程融合"
        - "教育技术学 · 信息技术教育教学论"
        - "教育技术学 · 多媒体课件与微课制作"
        - "教育技术学 · 摄像技术与后期制作"
        - "教育技术学 · 教学系统设计"
        - "教育技术学 · 教育传播学"
        - "教育技术学 · 教育动画制作"
        - "教育技术学 · 教育技术学导论"
        - "教育技术学 · 教育技术学研究方法"
        - "教育技术学 · 计算机网络"
    validations:
      required: true

  - type: input
    id: year
    attributes:
      label: 年份学期
      description: "填成 20xx + 春/秋，例如 2023春、2025秋、2026秋。填你实际上课的那个学期。"
      placeholder: "2025秋"
    validations:
      required: true

  - type: dropdown
    id: material_type
    attributes:
      label: 资料类型
      description: "这份资料是什么，决定放进课程下的哪个文件夹。"
      options:
        - "笔记"
        - "课件"
        - "试卷"
        - "作业"
        - "实验报告"
        - "复习资料"
    validations:
      required: true

  - type: textarea
    id: attachments
    attributes:
      label: 附件
      description: "把文件拖进来：最多 5 个、每个不超过 50MB（zip 不超过 20MB，合计不超过 100MB）。手机如无法添加附件，请直接发给维护者。"
      placeholder: |
        把文件拖进来后，GitHub 会自动生成类似下面的链接，请不要删掉：
        [我的笔记.pdf](https://github.com/user-attachments/assets/...)
        选「其他」年份学期时，也请在这里写清 20xx春 / 20xx秋。
    validations:
      required: true

  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      description: "上传前请自己检查一遍文件内容和文档属性。"
      options:
        - label: 文件里不含本人或他人的姓名、学号、手机号、身份证号
          required: true
    validations:
      required: true
