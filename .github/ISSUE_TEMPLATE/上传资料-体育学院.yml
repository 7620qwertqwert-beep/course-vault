# 由 scripts/gen_forms.py 自动生成，请勿手工编辑
name: "上传资料 · 体育学院"
description: "学院已填好，先选专业，再选课程。"
title: "[上传] "
labels: ["待入库"]
body:
  - type: dropdown
    id: category
    attributes:
      label: 课程类别
      description: "本模板固定为专业课，无需选择。"
      default: 0
      options:
        - "专业课"
    validations:
      required: true

  - type: input
    id: college
    attributes:
      label: 开课学院
      description: "已预填为本模板的学院；一般不用改。"
      value: "体育学院"
    validations:
      required: true

  - type: dropdown
    id: major
    attributes:
      label: 所属专业
      description: "先选你所在的专业，下一步的课程下拉会按这个专业核对。"
      options:
        - "体育教育"
        - "社会体育指导与管理"
    validations:
      required: true

  - type: dropdown
    id: course
    attributes:
      label: 课程名称
      description: "先在上一步选专业，然后在这里挑课程；每项前面是它所属的专业。只列出本学院的课程。"
      options:
        - "体育教育 · 体操"
        - "体育教育 · 体育学科教学论"
        - "体育教育 · 体育心理学"
        - "体育教育 · 体育概论"
        - "体育教育 · 体育社会学"
        - "体育教育 · 体育科学研究方法"
        - "体育教育 · 健康教育学"
        - "体育教育 · 学校体育学"
        - "体育教育 · 武术"
        - "体育教育 · 球类运动"
        - "体育教育 · 田径"
        - "体育教育 · 运动技能学习与控制"
        - "体育教育 · 运动生理学"
        - "体育教育 · 运动解剖学"
        - "社会体育指导与管理 · 体操"
        - "社会体育指导与管理 · 体育学科教学论"
        - "社会体育指导与管理 · 体育心理学"
        - "社会体育指导与管理 · 体育概论"
        - "社会体育指导与管理 · 体育社会学"
        - "社会体育指导与管理 · 体育科学研究方法"
        - "社会体育指导与管理 · 健康教育学"
        - "社会体育指导与管理 · 学校体育学"
        - "社会体育指导与管理 · 武术"
        - "社会体育指导与管理 · 球类运动"
        - "社会体育指导与管理 · 田径"
        - "社会体育指导与管理 · 运动技能学习与控制"
        - "社会体育指导与管理 · 运动生理学"
        - "社会体育指导与管理 · 运动解剖学"
    validations:
      required: true

  - type: input
    id: year
    attributes:
      label: 年份学期
      description: "填成 20xx + 春/秋，例如 2023春、2025秋、2026秋。填你实际上课的那个学期。"
      placeholder: "2025秋"
    validations:
      required: true

  - type: dropdown
    id: material_type
    attributes:
      label: 资料类型
      description: "这份资料是什么，决定放进课程下的哪个文件夹。"
      options:
        - "笔记"
        - "课件"
        - "试卷"
        - "作业"
        - "实验报告"
        - "复习资料"
    validations:
      required: true

  - type: textarea
    id: attachments
    attributes:
      label: 附件
      description: "把文件拖进来：最多 5 个、每个不超过 50MB（zip 不超过 20MB，合计不超过 100MB）。手机如无法添加附件，请直接发给维护者。"
      placeholder: |
        把文件拖进来后，GitHub 会自动生成类似下面的链接，请不要删掉：
        [我的笔记.pdf](https://github.com/user-attachments/assets/...)
        选「其他」年份学期时，也请在这里写清 20xx春 / 20xx秋。
    validations:
      required: true

  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      description: "上传前请自己检查一遍文件内容和文档属性。"
      options:
        - label: 文件里不含本人或他人的姓名、学号、手机号、身份证号
          required: true
    validations:
      required: true
