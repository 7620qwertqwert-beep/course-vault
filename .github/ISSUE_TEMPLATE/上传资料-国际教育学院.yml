# 由 scripts/gen_forms.py 自动生成，请勿手工编辑
name: "上传资料 · 国际教育学院"
description: "学院已填好，先选专业，再选课程。"
title: "[上传] "
labels: ["待入库"]
body:
  - type: dropdown
    id: category
    attributes:
      label: 课程类别
      description: "本模板固定为专业课，无需选择。"
      default: 0
      options:
        - "专业课"
    validations:
      required: true

  - type: input
    id: college
    attributes:
      label: 开课学院
      description: "已预填为本模板的学院；一般不用改。"
      value: "国际教育学院"
    validations:
      required: true

  - type: dropdown
    id: major
    attributes:
      label: 所属专业
      description: "先选你所在的专业，下一步的课程下拉会按这个专业核对。"
      options:
        - "土木工程"
        - "生物技术"
        - "经济学"
    validations:
      required: true

  - type: dropdown
    id: course
    attributes:
      label: 课程名称
      description: "先在上一步选专业，然后在这里挑课程；每项前面是它所属的专业。只列出本学院的课程。"
      options:
        - "土木工程 · Architectural Environmental Design"
        - "土木工程 · Construction Material and Resources"
        - "土木工程 · General Building Structure"
        - "土木工程 · Structural Analysis"
        - "土木工程 · 土力学与基础工程"
        - "土木工程 · 土木工程施工"
        - "土木工程 · 土木工程测量"
        - "土木工程 · 工程建设监理"
        - "土木工程 · 工程概预算"
        - "土木工程 · 房屋建筑学"
        - "土木工程 · 材料力学"
        - "土木工程 · 混凝土结构"
        - "土木工程 · 理论力学"
        - "土木工程 · 画法几何与工程制图"
        - "土木工程 · 结构力学"
        - "土木工程 · 钢结构"
        - "生物技术 · General Biology"
        - "生物技术 · Intermediary Metabolism"
        - "生物技术 · Recombinant DNA Technology"
        - "生物技术 · 分子生物学"
        - "生物技术 · 基因工程"
        - "生物技术 · 微生物学"
        - "生物技术 · 微生物工程及设备"
        - "生物技术 · 生化工程"
        - "生物技术 · 生物化学"
        - "生物技术 · 细胞工程"
        - "生物技术 · 细胞生物学"
        - "生物技术 · 遗传学"
        - "经济学 · Macroeconomics"
        - "经济学 · Microeconomics"
        - "经济学 · 会计学"
        - "经济学 · 宏观经济学"
        - "经济学 · 应用统计学"
        - "经济学 · 微观经济学"
        - "经济学 · 政治经济学"
        - "经济学 · 经济史"
        - "经济学 · 经济思想史"
        - "经济学 · 计量经济学"
        - "经济学 · 财政学"
    validations:
      required: true

  - type: dropdown
    id: year
    attributes:
      label: 年份学期
      description: "这份资料是哪一学年、哪个学期用的；选「其他」时请在附件框写清 20xx春 / 20xx秋。"
      options:
        - "2024秋"
        - "2025春"
        - "2025秋"
        - "2026春"
        - "2026秋"
        - "其他"
    validations:
      required: true

  - type: dropdown
    id: material_type
    attributes:
      label: 资料类型
      description: "这份资料是什么，决定放进课程下的哪个文件夹。"
      options:
        - "笔记"
        - "课件"
        - "试卷"
        - "作业"
        - "实验报告"
        - "复习资料"
        - "其他"
    validations:
      required: true

  - type: textarea
    id: attachments
    attributes:
      label: 附件
      description: "把文件拖进来：最多 5 个、每个不超过 50MB（zip 不超过 20MB，合计不超过 100MB）。手机如无法添加附件，请直接发给维护者。"
      placeholder: |
        把文件拖进来后，GitHub 会自动生成类似下面的链接，请不要删掉：
        [我的笔记.pdf](https://github.com/user-attachments/assets/...)
        选「其他」年份学期时，也请在这里写清 20xx春 / 20xx秋。
    validations:
      required: true

  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      description: "上传前请自己检查一遍文件内容和文档属性。"
      options:
        - label: 文件里不含本人或他人的姓名、学号、手机号、身份证号
          required: true
    validations:
      required: true
