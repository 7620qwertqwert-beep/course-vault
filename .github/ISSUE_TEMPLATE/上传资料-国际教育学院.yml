# 由 scripts/gen_forms.py 自动生成，请勿手工编辑
name: "上传资料 · 国际教育学院"
description: "学院已填好，先选专业，再填课程名。"
title: "[上传] "
labels: ["待入库"]
body:
  - type: dropdown
    id: category
    attributes:
      label: 课程类别
      description: "本模板固定为专业课，无需选择。"
      default: 0
      options:
        - "专业课"
    validations:
      required: true

  - type: input
    id: college
    attributes:
      label: 开课学院
      description: "已预填为本模板的学院；一般不用改。"
      value: "国际教育学院"
    validations:
      required: true

  - type: dropdown
    id: major
    attributes:
      label: 所属专业
      description: "先选你所在的专业，下一步填课程名时会按这个专业核对。"
      options:
        - "土木工程"
        - "生物技术"
        - "经济学"
    validations:
      required: true

  - type: input
    id: course
    attributes:
      label: 课程名称
      description: "照课程目录里的名字写；写成「专业 · 课程名」最好认（例：康复治疗学 · 康复评定学），只写课程名也能自动核对。"
      placeholder: "康复治疗学 · 康复评定学"
    validations:
      required: true

  - type: input
    id: year
    attributes:
      label: 年份学期
      description: "填成 20xx + 春/秋，例如 2023春、2025秋、2026秋。填你实际上课的那个学期。"
      placeholder: "2025秋"
    validations:
      required: true

  - type: dropdown
    id: material_type
    attributes:
      label: 资料类型
      description: "决定资料放进课程下哪个文件夹：笔记/课件/试卷/作业/实验报告/复习资料 各有一个目录。"
      options:
        - "笔记"
        - "课件"
        - "试卷"
        - "作业"
        - "实验报告"
        - "复习资料"
    validations:
      required: true

  - type: textarea
    id: attachments
    attributes:
      label: 附件
      description: "把文件拖进来：最多 5 个、每个不超过 50MB（zip 不超过 20MB，合计不超过 100MB）。手机如无法添加附件，请直接发给维护者。"
      placeholder: |
        把文件拖进来后，GitHub 会自动生成类似下面的链接，请不要删掉：
        [我的笔记.pdf](https://github.com/user-attachments/assets/...)
        年份学期请写成 20xx春 / 20xx秋（例：2025秋）。
    validations:
      required: true

  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      description: "上传前请自己检查一遍文件内容和文档属性。"
      options:
        - label: 文件里不含本人或他人的姓名、学号、手机号、身份证号
          required: true
    validations:
      required: true
