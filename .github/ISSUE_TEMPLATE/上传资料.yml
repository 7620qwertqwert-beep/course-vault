name: 上传资料
description: 选好课程和类型，把文件拖进来
title: "[上传] "
labels: ["待入库"]
body:
  - type: dropdown
    id: category
    attributes:
      label: 课程类别
      description: 公共课是全校都要学的课；专业课还要再选学院和专业。
      options:
        - 公共课
        - 专业课
    validations:
      required: true

  - type: input
    id: college
    attributes:
      label: 开课学院
      description: 例如：医学院、计算机与信息技术学院。写错不要紧，提交后机器人会告诉你正确写法
      placeholder: 例如：医学院
    validations:
      required: false

  - type: input
    id: major
    attributes:
      label: 所属专业
      description: 例如：医学院·康复治疗学（带学院更准）；只写专业名也可以
      placeholder: 例如：医学院·康复治疗学
    validations:
      required: false

  - type: input
    id: course
    attributes:
      label: 课程名称
      description: 必须与仓库已有课程名一致；写错会提示最接近的课程。公共课直接写课名，例如：高等数学。
      placeholder: 例如：康复医学概论
    validations:
      required: true

  - type: dropdown
    id: year
    attributes:
      label: 年份学期
      description: 这份资料是哪一学年、哪个学期用的；选「其他」时请在附件框写清 20xx春 / 20xx秋。
      options:
        - 2024秋
        - 2025春
        - 2025秋
        - 2026春
        - 2026秋
        - 其他
    validations:
      required: true

  - type: dropdown
    id: material_type
    attributes:
      label: 资料类型
      description: 这份资料是什么，决定放进课程下的哪个文件夹。
      options:
        - 笔记
        - 课件
        - 试卷
        - 作业
        - 实验报告
        - 复习资料
        - 其他
    validations:
      required: true

  - type: textarea
    id: attachments
    attributes:
      label: 附件
      description: 把文件拖进来：最多 5 个、每个不超过 50MB（zip 不超过 20MB，合计不超过 100MB）。手机如无法添加附件，请直接发给维护者。
      placeholder: |
        把文件拖进来后，GitHub 会自动生成类似下面的链接，请不要删掉：
        [我的笔记.pdf](https://github.com/user-attachments/assets/...)
        选「其他」年份学期时，也请在这里写清 20xx春 / 20xx秋。
    validations:
      required: true

  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      description: 上传前请自己检查一遍文件内容和文档属性。
      options:
        - label: 文件里不含本人或他人的姓名、学号、手机号、身份证号
          required: true
    validations:
      required: true
