name: "上传资料（通用：不知道选哪个学院就用这个）"
description: "选好课程和类型，把文件拖进来。建议优先用按学院分的模板，选项更少"
title: "[上传] "
labels: ["待入库"]
body:
  - type: dropdown
    id: category
    attributes:
      label: 课程类别
      description: 公共课是全校都要学的课；专业课还要再选学院和专业。
      options:
        - 公共课
        - 专业课
    validations:
      required: true

  - type: dropdown
    id: college
    attributes:
      label: 开课学院
      description: 只有专业课要选；公共课留空，留空也能提交。
      options:
        - "传媒学院"
        - "体育学院"
        - "化学化工学院"
        - "医学院"
        - "历史文化学院"
        - "商学院"
        - "国际教育学院"
        - "地理科学学院"
        - "外国语学院"
        - "建筑与土木工程学院"
        - "教师教育学院"
        - "教育科学学院"
        - "数学与统计学院"
        - "文学院"
        - "新能源科学与技术学院"
        - "旅游学院"
        - "法学与社会学学院"
        - "物理电子工程学院"
        - "生命科学学院"
        - "美术与设计学院"
        - "茶学与食品学院"
        - "计算机与信息技术学院"
        - "音乐与舞蹈学院"
        - "马克思主义学院"
    validations:
      required: false

  - type: dropdown
    id: major
    attributes:
      label: 所属专业
      description: 只有专业课要选；按「学院·专业」找到你所在的专业，公共课留空。
      options:
        - "传媒学院·动画"
        - "传媒学院·广播电视编导"
        - "传媒学院·戏剧影视文学"
        - "传媒学院·播音与主持艺术"
        - "体育学院·体育教育"
        - "体育学院·社会体育指导与管理"
        - "化学化工学院·化学"
        - "化学化工学院·化学工程与工艺"
        - "化学化工学院·应用化学"
        - "化学化工学院·材料化学"
        - "医学院·健康服务与管理"
        - "医学院·医学影像技术"
        - "医学院·康复治疗学"
        - "医学院·护理学"
        - "医学院·生物医药数据科学"
        - "历史文化学院·历史学"
        - "历史文化学院·文化产业管理"
        - "商学院·会计学"
        - "商学院·国际经济与贸易"
        - "商学院·市场营销"
        - "商学院·数字经济"
        - "商学院·经济学"
        - "商学院·金融工程"
        - "国际教育学院·土木工程"
        - "国际教育学院·生物技术"
        - "国际教育学院·经济学"
        - "地理科学学院·地理信息科学"
        - "地理科学学院·地理科学"
        - "地理科学学院·测绘工程"
        - "地理科学学院·环境科学与工程"
        - "地理科学学院·自然地理与资源环境"
        - "地理科学学院·遥感科学与技术"
        - "外国语学院·日语"
        - "外国语学院·翻译"
        - "外国语学院·英语"
        - "建筑与土木工程学院·土木工程"
        - "建筑与土木工程学院·工程管理"
        - "建筑与土木工程学院·船舶与海洋工程"
        - "建筑与土木工程学院·道路桥梁与渡河工程"
        - "教师教育学院·小学教育"
        - "教师教育学院·科学教育"
        - "教育科学学院·学前教育"
        - "教育科学学院·心理学"
        - "教育科学学院·教育学"
        - "教育科学学院·教育技术学"
        - "数学与统计学院·信息与计算科学"
        - "数学与统计学院·应用统计学"
        - "数学与统计学院·数学与应用数学"
        - "数学与统计学院·统计学"
        - "文学院·汉语国际教育"
        - "文学院·汉语言文学"
        - "新能源科学与技术学院·新能源材料与器件"
        - "新能源科学与技术学院·新能源科学与工程"
        - "新能源科学与技术学院·材料科学与工程"
        - "旅游学院·旅游管理"
        - "旅游学院·酒店管理"
        - "法学与社会学学院·法学"
        - "法学与社会学学院·社会工作"
        - "物理电子工程学院·新能源科学与工程"
        - "物理电子工程学院·材料物理"
        - "物理电子工程学院·物理学"
        - "物理电子工程学院·电子信息工程"
        - "物理电子工程学院·电子科学与技术"
        - "物理电子工程学院·电气工程及其自动化"
        - "生命科学学院·生物信息学"
        - "生命科学学院·生物制药"
        - "生命科学学院·生物技术"
        - "生命科学学院·生物科学"
        - "美术与设计学院·环境设计"
        - "美术与设计学院·美术学"
        - "美术与设计学院·视觉传达设计"
        - "茶学与食品学院·茶学"
        - "茶学与食品学院·食品科学与工程"
        - "茶学与食品学院·食品质量与安全"
        - "计算机与信息技术学院·人工智能"
        - "计算机与信息技术学院·密码科学与技术"
        - "计算机与信息技术学院·数据科学与大数据技术"
        - "计算机与信息技术学院·物联网工程"
        - "计算机与信息技术学院·计算机科学与技术"
        - "计算机与信息技术学院·软件工程"
        - "音乐与舞蹈学院·舞蹈表演"
        - "音乐与舞蹈学院·音乐学"
        - "音乐与舞蹈学院·音乐表演"
        - "马克思主义学院·思想政治教育"
    validations:
      required: false

  - type: input
    id: course
    attributes:
      label: 课程名称
      description: 照着课程卡片上的名字抄，必须和仓库里已有的课程文件夹一模一样；公共课直接写课名，例如：高等数学。
      placeholder: 例如：康复医学概论
    validations:
      required: true

  - type: input
    id: year
    attributes:
      label: 年份学期
      description: "填成 20xx + 春/秋，例如 2023春、2025秋、2026秋。填你实际上课的那个学期。"
      placeholder: "2025秋"
    validations:
      required: true

  - type: dropdown
    id: material_type
    attributes:
      label: 资料类型
      description: 这份资料是什么，决定放进课程下的哪个文件夹。
      options:
        - 笔记
        - 课件
        - 试卷
        - 作业
        - 实验报告
        - 复习资料
        - 其他
    validations:
      required: true

  - type: textarea
    id: attachments
    attributes:
      label: 附件
      description: 把文件拖进来：最多 5 个、每个不超过 50MB（zip 不超过 20MB，合计不超过 100MB）。手机如无法添加附件，请直接发给维护者。
      placeholder: |
        把文件拖进来后，GitHub 会自动生成类似下面的链接，请不要删掉：
        [我的笔记.pdf](https://github.com/user-attachments/assets/...)
        选「其他」年份学期时，也请在这里写清 20xx春 / 20xx秋。
    validations:
      required: true

  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      description: 上传前请自己检查一遍文件内容和文档属性。
      options:
        - label: 文件里不含本人或他人的姓名、学号、手机号、身份证号
          required: true
    validations:
      required: true
