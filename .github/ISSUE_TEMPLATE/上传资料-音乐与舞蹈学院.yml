# 由 scripts/gen_forms.py 自动生成，请勿手工编辑
name: "上传资料 · 音乐与舞蹈学院"
description: "学院已填好，先选专业，再选课程。"
title: "[上传] "
labels: ["待入库"]
body:
  - type: dropdown
    id: category
    attributes:
      label: 课程类别
      description: "本模板固定为专业课，无需选择。"
      default: 0
      options:
        - "专业课"
    validations:
      required: true

  - type: input
    id: college
    attributes:
      label: 开课学院
      description: "已预填为本模板的学院；一般不用改。"
      value: "音乐与舞蹈学院"
    validations:
      required: true

  - type: dropdown
    id: major
    attributes:
      label: 所属专业
      description: "先选你所在的专业，下一步的课程下拉会按这个专业核对。"
      options:
        - "舞蹈表演"
        - "音乐学"
        - "音乐表演"
    validations:
      required: true

  - type: dropdown
    id: course
    attributes:
      label: 课程名称
      description: "先在上一步选专业，然后在这里挑课程；每项前面是它所属的专业。只列出本学院的课程。"
      options:
        - "舞蹈表演 · 中国古代舞蹈史"
        - "舞蹈表演 · 中国古典舞基础训练"
        - "舞蹈表演 · 中国近现代舞蹈史"
        - "舞蹈表演 · 古典舞身韵"
        - "舞蹈表演 · 外国舞蹈史"
        - "舞蹈表演 · 民族民间舞"
        - "舞蹈表演 · 舞蹈艺术概论"
        - "舞蹈表演 · 芭蕾基础训练"
        - "音乐学 · 中国民族音乐"
        - "音乐学 · 中国音乐史与名作欣赏"
        - "音乐学 · 伴奏与弹唱"
        - "音乐学 · 合唱指挥"
        - "音乐学 · 和声"
        - "音乐学 · 器乐"
        - "音乐学 · 声乐"
        - "音乐学 · 曲式"
        - "音乐学 · 西方音乐史与名作欣赏"
        - "音乐学 · 视唱练耳"
        - "音乐学 · 钢琴"
        - "音乐学 · 音乐教学论（含中小学音乐课程标准解读、教材分析等）"
    validations:
      required: true

  - type: dropdown
    id: year
    attributes:
      label: 年份学期
      description: "这份资料是哪一学年、哪个学期用的；选「其他」时请在附件框写清 20xx春 / 20xx秋。"
      options:
        - "2024秋"
        - "2025春"
        - "2025秋"
        - "2026春"
        - "2026秋"
        - "其他"
    validations:
      required: true

  - type: dropdown
    id: material_type
    attributes:
      label: 资料类型
      description: "这份资料是什么，决定放进课程下的哪个文件夹。"
      options:
        - "笔记"
        - "课件"
        - "试卷"
        - "作业"
        - "实验报告"
        - "复习资料"
        - "其他"
    validations:
      required: true

  - type: textarea
    id: attachments
    attributes:
      label: 附件
      description: "把文件拖进来：最多 5 个、每个不超过 50MB（zip 不超过 20MB，合计不超过 100MB）。手机如无法添加附件，请直接发给维护者。"
      placeholder: |
        把文件拖进来后，GitHub 会自动生成类似下面的链接，请不要删掉：
        [我的笔记.pdf](https://github.com/user-attachments/assets/...)
        选「其他」年份学期时，也请在这里写清 20xx春 / 20xx秋。
    validations:
      required: true

  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      description: "上传前请自己检查一遍文件内容和文档属性。"
      options:
        - label: 文件里不含本人或他人的姓名、学号、手机号、身份证号
          required: true
    validations:
      required: true
